<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#EAE7E0"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="0.3" opacity="0.12"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#161616" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#dots)"/>
  
  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="500" fill="#E24A26"/>
  
  <!-- Top right decorative corner element -->
  <rect x="680" y="0" width="120" height="120" fill="#161616" opacity="0.04"/>
  <line x1="680" y1="0" x2="800" y2="120" stroke="#161616" stroke-width="0.5" opacity="0.15"/>
  
  <!-- Main card inset -->
  <rect x="48" y="48" width="704" height="404" rx="4" fill="none" stroke="#161616" stroke-width="0.8" opacity="0.2"/>
  
  <!-- Top label area -->
  <text x="72" y="100" font-family="Georgia, serif" font-size="10" font-weight="400" fill="#E24A26" letter-spacing="4" opacity="1">CERTIFICATE OF COMPLETION</text>
  
  <!-- Divider line -->
  <line x1="72" y1="115" x2="420" y2="115" stroke="#161616" stroke-width="0.6" opacity="0.3"/>
  
  <!-- Recipient label -->
  <text x="72" y="155" font-family="Georgia, serif" font-size="11" fill="#787670" letter-spacing="1.5">Awarded to</text>
  
  <!-- Name -->
  <text x="72" y="195" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#161616">Muhammad Humail Abbas</text>
  
  <!-- Course title -->
  <text x="72" y="255" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#161616" opacity="0.85">Digital Marketing &amp; SEO</text>
  
  <!-- Description -->
  <text x="72" y="295" font-family="Arial, sans-serif" font-size="12" fill="#787670">Successfully completed coaching &amp; hands-on practice — 10th Convocation Ceremony</text>
  
  <!-- Bottom divider -->
  <line x1="72" y1="340" x2="728" y2="340" stroke="#161616" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Issuer + date row -->
  <text x="72" y="370" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#161616" letter-spacing="1">PNY Trainings</text>
  <text x="72" y="390" font-family="Arial, sans-serif" font-size="10" fill="#787670" letter-spacing="0.5">Pakistan's #1 IT Training Institute · NAVTTC</text>
  
  <!-- Year badge -->
  <rect x="650" y="350" width="78" height="52" rx="2" fill="#161616"/>
  <text x="689" y="373" font-family="Arial, sans-serif" font-size="10" fill="#EAE7E0" text-anchor="middle" letter-spacing="1">YEAR</text>
  <text x="689" y="393" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#E24A26" text-anchor="middle">2025</text>
  
  <!-- Small seal -->
  <circle cx="720" cy="200" r="38" fill="none" stroke="#E24A26" stroke-width="1.2" opacity="0.25"/>
  <circle cx="720" cy="200" r="28" fill="none" stroke="#E24A26" stroke-width="0.7" opacity="0.2"/>
  <text x="720" y="196" font-family="Arial, sans-serif" font-size="7" fill="#E24A26" text-anchor="middle" letter-spacing="1" opacity="0.6">VERIFIED</text>
  <text x="720" y="208" font-family="Arial, sans-serif" font-size="7" fill="#E24A26" text-anchor="middle" letter-spacing="1" opacity="0.6">CREDENTIAL</text>
</svg>
