  <rect x="80" y="187" width="180" height="14" rx="3" fill="#787670" opacity="0.4"/>
  
  <rect x="80" y="225" width="140" height="40" rx="6" fill="#E24A26"/>
  
  <!-- Visual Product Preview Cards inside mockup -->
  <rect x="420" y="120" width="260" height="360" rx="8" fill="#161616"/>
  <rect x="440" y="140" width="220" height="180" rx="4" fill="#EAE7E0"/>
  <rect x="440" y="340" width="160" height="18" rx="3" fill="#F4F3EF"/>
