<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#E8E5DC"/>
  <!-- Layer 1 Shadow frame -->
  <rect x="60" y="70" width="680" height="480" rx="12" fill="#DFDBD0"/>
  
  <!-- Layer 2 Main Browser frame -->
  <rect x="40" y="50" width="680" height="480" rx="12" fill="#F4F3EF" stroke="#D3CFBF" stroke-width="2"/>
  
  <!-- Browser Chrome Header -->
  <rect x="40" y="50" width="680" height="40" rx="12" fill="#E8E5DC"/>
  <circle cx="70" cy="70" r="5" fill="#E24A26"/>
  <circle cx="88" cy="70" r="5" fill="#E5B25D"/>
  <circle cx="106" cy="70" r="5" fill="#75B086"/>
  <rect x="140" y="61" width="240" height="18" rx="4" fill="#D8D4C9"/>

  <!-- Content Layout Mockup -->
  <rect x="80" y="120" width="300" height="32" rx="4" fill="#161616"/>
